<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCare AI - Secure Staff Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            clinical: { 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
            tealcare: { 500: '#14b8a6', 600: '#0d9488' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
    
    <!-- Header Branding -->
    <div class="bg-gradient-to-tr from-clinical-900 to-tealcare-600 p-6 text-white text-center">
      <div class="w-12 h-12 mx-auto rounded-xl bg-white/10 flex items-center justify-center text-white text-2xl shadow-inner mb-3 border border-white/20">
        <i class="fa-solid fa-hospital"></i>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight">SmartCare <span class="text-tealcare-300">AI</span></h1>
      <p class="text-xs text-slate-200 mt-1">Intelligent Hospital Operations & Capacity Platform</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)" class="p-6 space-y-4 text-xs">
      
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Select Hospital Facility</label>
        <select id="login-facility" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-slate-800 focus:outline-none focus:border-clinical-600 bg-slate-50 font-medium">
          <option value="metro">🏥 Metro General Hospital & Level-1 Trauma</option>
          <option value="stjude">🏥 St. Jude Community Medical Center</option>
          <option value="mercy">🏥 Mercy Regional Specialty Care</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Staff Username / ID</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <i class="fa-solid fa-user-doctor"></i>
          </span>
          <input type="text" id="login-username" required placeholder="e.g. dr.vance or admin" class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-slate-800 focus:outline-none focus:border-clinical-600">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Secure PIN / Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-slate-800 focus:outline-none focus:border-clinical-600">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Access Role</label>
        <select id="login-role" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-slate-800 focus:outline-none focus:border-clinical-600 bg-slate-50">
          <option value="admin">Operations Command / Administrator</option>
          <option value="triage">Emergency Triage Nurse</option>
          <option value="evs">Environmental Services (EVS) Lead</option>
          <option value="physician">Attending Physician / Discharges</option>
        </select>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-3 bg-clinical-600 hover:bg-clinical-700 text-white rounded-xl font-bold shadow-lg transition flex items-center justify-center space-x-2 text-sm">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Authenticate & Launch Portal</span>
        </button>
      </div>

      <div class="text-center pt-2 text-[11px] text-slate-500">
        Secured via local session token &bull; Integrates with <code class="text-slate-700 font-mono">smartcare-ai\data\</code>
      </div>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const facility = document.getElementById('login-facility').value;
      const username = document.getElementById('login-username').value;
      const role = document.getElementById('login-role').value;

      // Store session metadata
      localStorage.setItem('smartcare_session', JSON.stringify({
        facility,
        username,
        role,
        logged_in_at: new Date().toISOString()
      }));

      // Redirect directly to your main operations platform
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
